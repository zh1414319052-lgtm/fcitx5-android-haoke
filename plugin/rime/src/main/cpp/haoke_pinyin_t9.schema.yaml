# SPDX-License-Identifier: GPL-3.0-only
schema:
  schema_id: haoke_pinyin_t9
  name: 9-key Pinyin
  version: '1.0'

switches:
  - name: zh_hans
    reset: 1

engine:
  processors: [key_binder, speller, punctuator, selector, navigator, express_editor]
  segmentors: [abc_segmentor, punct_segmentor, fallback_segmentor]
  translators: [punct_translator, script_translator]
  filters: [simplifier, uniquifier]

speller:
  alphabet: '23456789'
  delimiter: "'"
  algebra:
    - xlit/abcdefghijklmnopqrstuvwxyz/22233344455566677778889999/

translator:
  dictionary: luna_pinyin
  prism: haoke_pinyin_t9
  user_dict: haoke_pinyin_t9
  spelling_hints: 1
  comment_format:
    - xform/([nl])v/$1ü/

simplifier:
  option_name: zh_hans
  opencc_config: t2s.json
  tips: none

punctuator:
  half_shape:
    ',': { commit: '，' }
    '.': { commit: '。' }

key_binder:
  bindings:
    - { when: has_menu, accept: Return, send: space }

menu:
  page_size: 8
